name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # NOTE: a mismatch would ship builds whose --version disagrees with their release tag.
      - run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "${{ github.ref_name }}" || { echo "tag ${{ github.ref_name }} doesn't match Cargo.toml version $version"; exit 1; }

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test --locked
      - run: cargo build --locked --release
      - shell: pwsh
        run: |
          $name = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].name
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target\release\$name.exe" dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: check
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test --locked
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - run: cargo build --locked --release --target x86_64-apple-darwin
      - name: bundle universal GemDigger.app
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          app=dist/GemDigger.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/$name" \
            "target/aarch64-apple-darwin/release/$name" "target/x86_64-apple-darwin/release/$name"
          sed "s/VERSION/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"
          # Ad-hoc signature: unsigned arm64 code won't launch at all; this isn't a Developer ID.
          codesign --force --deep --sign - "$app"
          test "$("$app/Contents/MacOS/$name" --version)" = "$name $version"
          lipo -archs "$app/Contents/MacOS/$name"
          (cd dist && ditto -c -k --keepParent GemDigger.app "$name-macos.zip" && rm -rf GemDigger.app)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes
