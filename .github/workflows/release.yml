name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - name: check tag matches Cargo.toml
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          # NOTE: a mismatch would ship an .exe whose --version disagrees with its release tag.
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} doesn't match Cargo.toml version $version" }
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: package exe and SHA256SUMS
        shell: pwsh
        run: |
          $name = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].name
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target\release\$name.exe" dist\
          $hash = (Get-FileHash "dist\$name.exe" -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path dist\SHA256SUMS -Value "$hash  $name.exe" -Encoding ascii
          Get-Content dist\SHA256SUMS
      - name: publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" (Get-ChildItem dist).FullName --verify-tag --generate-notes
