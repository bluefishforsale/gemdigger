name: release

# A v* tag builds Windows and macOS, signs both (Authenticode through Azure
# Artifact Signing, Developer ID plus notarization through Apple), and only then
# publishes. Every job that touches a signing secret runs in the `release`
# environment, which only v* tags can deploy to, so pull requests never see them.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      # NOTE: a mismatch would ship builds whose --version disagrees with their release tag.
      - name: tag matches Cargo.toml
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          test "v$version" = "$TAG" || { echo "tag $TAG doesn't match Cargo.toml version $version"; exit 1; }
      - name: every signing input is present
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_CERT_PROFILE: ${{ vars.AZURE_CERT_PROFILE }}
        run: scripts/check-release-secrets.sh

  windows-build:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test --locked
      - run: cargo build --locked --release
      - shell: pwsh
        run: |
          $name = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].name
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item "target\release\$name.exe" dist\
      - uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: dist/*
          if-no-files-found: error

  windows-sign:
    needs: windows-build
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows-unsigned
          path: dist
      # NOTE: the CI identity's only role is Certificate Profile Signer on the
      # signing account, not the subscription, so login must not require one.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERT_PROFILE }}
          files-folder: ${{ github.workspace }}\dist
          files-folder-filter: exe
          exclude-environment-credential: true
      - run: ./scripts/verify-authenticode.ps1 -Folder dist
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
          if-no-files-found: error

  macos:
    needs: check
    runs-on: macos-latest
    environment: release
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo test --locked
      - run: cargo build --locked --release --target aarch64-apple-darwin
      - run: cargo build --locked --release --target x86_64-apple-darwin
      - name: signing keychain and notarization key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: scripts/macos-signing-setup.sh
      - name: bundle, sign and notarize GemDigger.app
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          name=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].name')
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          app=dist/GemDigger.app
          mkdir -p "$app/Contents/MacOS"
          lipo -create -output "$app/Contents/MacOS/$name" \
            "target/aarch64-apple-darwin/release/$name" "target/x86_64-apple-darwin/release/$name"
          sed "s/VERSION/$version/g" packaging/Info.plist > "$app/Contents/Info.plist"
          # Notarization requires the hardened runtime and a secure timestamp.
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          # Stapling fails unless Apple accepted it, so a rejected build stops here.
          xcrun stapler staple "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          test "$("$app/Contents/MacOS/$name" --version)" = "$name $version"
          lipo -archs "$app/Contents/MacOS/$name"
          (cd dist && ditto -c -k --keepParent GemDigger.app "$name-macos.zip" && rm -rf GemDigger.app)
      - name: remove the signing keychain
        if: always()
        run: scripts/macos-signing-cleanup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*
          if-no-files-found: error

  publish:
    needs: [windows-sign, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist
      - run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
