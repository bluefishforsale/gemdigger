name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # On Windows, not Linux, so clippy and tests see the same cfg the shipped .exe does.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - run: cargo fmt -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: smoke-run the release exe
        shell: pwsh
        run: |
          $pkg = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0]
          # NOTE: a GUI-subsystem exe isn't waited on or captured by `& exe`; Start-Process with redirection does both.
          $out = New-TemporaryFile
          $p = Start-Process "target\release\$($pkg.name).exe" -ArgumentList "--version" -Wait -PassThru -NoNewWindow -RedirectStandardOutput $out
          $line = (Get-Content $out -Raw).Trim()
          if ($p.ExitCode -ne 0 -or $line -ne "$($pkg.name) $($pkg.version)") { throw "unexpected --version output (exit $($p.ExitCode)): $line" }
          $line

  scripts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - shell: pwsh
        run: |
          foreach ($script in Get-ChildItem *.ps1) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $errors; exit 1 }
          }
          $issues = Invoke-ScriptAnalyzer -Path . -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          if ($issues) { $issues | Format-Table -AutoSize; exit 1 }

  hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck .githooks/pre-commit
