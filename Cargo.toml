[package]
name = "gemdigger"
version = "0.2.1"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
anyhow = "1"
dirs = "7"
macroquad = { version = "0.4", features = ["audio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Synthesizing the music at startup is slow without optimization; this keeps
# `cargo run` startup bearable while our own crate stays quick to rebuild.
[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
